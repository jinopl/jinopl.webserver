---
# defaults file for jinopl.webserver

########swap mangement########
swap_file_path: /swapfile
swap_file_size_mb: '2048'
swap_swappiness: "30"
swap_file_state: present
swap_file_create_command: "dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_file_size_mb }}"
swap_test_mode: false

######User managment##########
# Passwords below are placeholders. Set real values in your playbook or
# inventory, ideally with Ansible Vault; the role stops if any is left as CHANGE_ME.
userGroupName: avangers
normalUser: ironman
normalUserPass: "CHANGE_ME"
sudoUser: hulk
sudoUserPass: "CHANGE_ME"


######Apache managment#########
httpdUsername: apache
apacheUsername: www-data
documentRoot: /var/www/html
#domain for virtual host
domain_name: foo.com
#True if subdomain or false
ifsubdomain: true

#######Mysql Managment#########
rootPass: "CHANGE_ME"
mysqlUser: dbguy
mysqlUserPassword: "CHANGE_ME"


########php###############
# PHP version to install, as "MAJOR.MINOR" (e.g. "8.2").
#   ""     -> use the distribution's default PHP packages
#             (exception: CentOS/RHEL 7 ships PHP 5.4, so php_el7_default_version
#             is used there instead).
#   "X.Y"  -> pin that version. If the OS repositories do not provide it, an
#             extra repository is added automatically (see php_extra_repo):
#               Ubuntu      -> ppa:ondrej/php
#               Debian      -> packages.sury.org/php
#               RHEL/CentOS -> Remi (remi-phpXY repo on EL7, php:remi-X.Y module on EL8+)
php_version: ""
# When to use the extra repository:
#   auto   -> only when the pinned version is not available from the OS repos
#   always -> always use it (needs php_version to be set)
#   never  -> never add it; fail if the pinned version is not available
php_extra_repo: auto
php_el7_default_version: '7.3'
php_packages_state: 'present'

# Extensions installed on Debian/Ubuntu. Each name is prefixed with "php-"
# (or "phpX.Y-" when php_version is pinned).
php_debian_extensions:
  - cli
  - common
  - curl
  - gd
  - imap
  - mbstring
  - mysql
  - zip
  - intl
  - bcmath
  - xml

# Packages installed on RHEL/CentOS.
php_rhel_packages:
  - php
  - php-cli
  - php-common
  - php-gd
  - php-mbstring
  - php-mysqlnd
  - php-pdo
  - php-xml
  - php-intl
  - php-bcmath
  - php-pecl-zip

remi_repo_url: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"

#######phpmyadmin############
# Repos to enable when installing phpMyAdmin on RHEL. Empty = the same repos
# used for PHP (Remi when it is in use, otherwise EPEL).
phpmyadmin_enablerepo: ""
phpmyadmin_config_file: /etc/phpmyadmin/config.inc.php

########composer###########
composer_path: /usr/local/bin/composer
