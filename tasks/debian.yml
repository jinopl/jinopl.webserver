---
- name: Testing Ansible in os
  debug:
    msg:
      - Hello from  {{ ansible_distribution }} {{ ansible_distribution_version }}
      - Hostname is {{ ansible_hostname }}

- import_tasks: debian/preinstall.yml
- import_tasks: swapmgmt.yml
  when: swap_test_mode
  tags: notest
- import_tasks: usrmgmt.yml
- import_tasks: debian/apache2.yml
- import_tasks: debian/mysql.yml
  tags: notest
- import_tasks: debian/php.yml