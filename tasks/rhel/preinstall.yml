- name: Set timezone to Asia/Kolkata
  timezone:
    name: Asia/Kolkata
  notify: restart crond
  tags: notest

- name: Installing necessary softwares
  yum: name="{{ item }}" state=present
  loop:
    - epel-release
    - vim
    - yum-utils
    - certbot
    - python3-certbot-apache
    - mod_ssl
    - unzip
    - htop
    - git
    - openssh-server
    - python3-devel
    - python3-pip

- name: install dev-tools
  yum:
    name: "@Development tools"
    state: present
